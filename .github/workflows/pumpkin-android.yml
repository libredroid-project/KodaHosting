# Baut Pumpkin (Rust-Minecraft-Server) als natives aarch64-linux-android Binary.
# Ergebnis: pumpkin-android-arm64.tar.xz als Actions-Artifact.
name: Pumpkin Android Build

on:
  workflow_dispatch:
    inputs:
      pumpkin_ref:
        description: 'Pumpkin branch oder tag'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Checkout Pumpkin
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.pumpkin_ref }}" \
            https://github.com/Pumpkin-MC/Pumpkin.git pumpkin
          echo "Pumpkin cloned, binary crate at crates/pumpkin"

      - name: Build for Android ARM64
        working-directory: pumpkin
        run: |
          # NDK finden und Umgebungsvariablen setzen
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          if [ -z "$NDK_DIR" ]; then
            echo "ERROR: No NDK found at $ANDROID_HOME"
            ls -la $ANDROID_HOME/
            exit 1
          fi
          echo "NDK: $NDK_DIR"

          TOOLCHAIN=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin
          API=24

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android${API}-clang
          export AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar
          export CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android${API}-clang
          export CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android${API}-clang++
          export RANLIB_aarch64_linux_android=$TOOLCHAIN/llvm-ranlib

          echo "Building Pumpkin for aarch64-linux-android..."
          cargo build --target aarch64-linux-android --release -p pumpkin

          BINARY=target/aarch64-linux-android/release/pumpkin
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Binary not found at $BINARY"
            find target -name "pumpkin" -type f 2>/dev/null | head -5
            exit 1
          fi

          # Strip debug symbols (~110MB -> ~15-25MB)
          $TOOLCHAIN/llvm-strip "$BINARY"
          ls -lh "$BINARY"

      - name: Package
        run: |
          mkdir -p pkg
          cp pumpkin/target/aarch64-linux-android/release/pumpkin pkg/pumpkin-android-arm64
          chmod +x pkg/pumpkin-android-arm64
          tar -cJf pumpkin-android-arm64.tar.xz -C pkg pumpkin-android-arm64
          ls -lh pumpkin-android-arm64.tar.xz
          sha256sum pumpkin-android-arm64.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-android-arm64
          path: pumpkin-android-arm64.tar.xz
          retention-days: 30
