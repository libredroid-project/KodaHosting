name: Deploy Website to GitHub Pages

on:
  push:
    branches: [master]
    paths: [website/**, app/src/main/assets/licenses/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The website renders the app's own legal documents (single source of
      # truth): copy them in at deploy time so site and app can never drift.
      - name: Sync legal documents from app assets
        run: |
          mkdir -p website/legal
          cp app/src/main/assets/licenses/privacy.txt website/legal/
          cp app/src/main/assets/licenses/tos.txt website/legal/
          cp app/src/main/assets/licenses/impressum.txt website/legal/
          cp app/src/main/assets/licenses/gpl_v3.txt website/legal/
          cp app/src/main/assets/licenses/gemma_ai.txt website/legal/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
